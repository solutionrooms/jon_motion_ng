[package]
name = "jon_motion"
version = "0.1.4"
edition = "2021"
description = "Scriptable pixel art, palette and tile map editor"

[dependencies]
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
egui_dock = "0.16"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
bincode = "1.3"
flate2 = "1"
png = "0.17"
rfd = "0.15"
arboard = "3"
mlua = { version = "0.10", features = ["lua54", "vendored", "serialize"] }
tiny_http = "0.12"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "thin"
strip = true
